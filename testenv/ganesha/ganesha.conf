# nfs-ganesha, VFS FSAL. Pseudo paths equal export paths so v3 and v4 agree.
NFS_CORE_PARAM {
    Protocols = 3, 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSV4 {
    Grace_Period = 5;
    RecoveryBackend = fs;
    Minor_Versions = 0, 1, 2;
}

EXPORT_DEFAULTS {
    Protocols = 3, 4;
    SecType = sys;
}

EXPORT {
    Export_Id = 1;
    Path = /export/rw;
    Pseudo = /export/rw;
    Access_Type = RW;
    Squash = No_Root_Squash;
    FSAL { Name = VFS; }
}

EXPORT {
    Export_Id = 2;
    Path = /export/ro;
    Pseudo = /export/ro;
    Access_Type = RO;
    Squash = Root_Squash;
    FSAL { Name = VFS; }
}
