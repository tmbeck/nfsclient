name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: pip install cargo-zigbuild ziglang

      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (zig)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          name="nfsc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/nfsc" LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            nfsc-*.tar.gz
            nfsc-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

# Publishing to crates.io is manual: `cargo publish` after the release is verified.
