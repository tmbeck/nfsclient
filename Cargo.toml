[package]
name = "nfsc"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Userspace NFS client: browse and transfer files on NFS exports without mounting"
readme = "README.md"
authors = ["Tim Beck"]
documentation = "https://docs.rs/nfsc"
# TODO: set once a remote exists:
# repository = "https://example.invalid/OWNER/nfsc"
# homepage = "https://example.invalid/OWNER/nfsc"
exclude = ["/testenv/", "/.claude/", "/.github/", "/justfile", "/target/", "/DESIGN.md", "/.gitignore"]
keywords = ["nfs", "rpc", "filesystem", "client", "cli"]
categories = ["network-programming", "filesystem", "command-line-utilities"]
rust-version = "1.85"

[lib]
name = "nfsc"
path = "src/lib.rs"

[[bin]]
name = "nfsc"
path = "src/bin/nfsc/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The library itself is std-only; CLI dependencies live behind this feature.
cli = ["dep:clap", "dep:rustyline", "dep:ctrlc", "dep:indicatif"]

[dependencies]
socket2 = "0.6"
clap = { version = "4.6", features = ["derive"], optional = true }
rustyline = { version = "19.0", optional = true }
ctrlc = { version = "3.5", optional = true }
indicatif = { version = "0.18", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
